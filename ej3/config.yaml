# Config EJ3 — VAE sobre MNIST 28x28 (variante alternativa del EJ2).
#
# El EJ3 reutiliza EXACTAMENTE el VAE de ej2/models/vae.py (numpy puro, ya
# gradchequeado). Lo único distinto es el dataset (MNIST, input_dim=784) y que
# acá el experimento central es BARRER LA CANTIDAD DE CAPAS OCULTAS.
#
# === CONFIG OVERNIGHT (≈5 h con 1 semilla) ===
# 60.000 imágenes, 500 épocas, 1 realización (semilla 42) por arquitectura.
# La réplica (semilla 123) está deshabilitada (ver `seeds` abajo); activarla
# duplica los jobs (~10 h). El usuario pidió NO obsesionarse con la varianza.
# Todo se entrena con el runner pausable/continuable:
#     python3 ej3/run_resumable.py            # corre / reanuda todos los jobs
#     python3 ej3/run_resumable.py --status   # ver progreso
# Se pausa con Ctrl-C (guarda checkpoint) y se reanuda volviéndolo a correr.
#
# EXTENDER en el futuro (aunque ya haya terminado):
#     python3 ej3/run_resumable.py --extend 300   # 300 épocas MÁS por job
#     python3 ej3/run_resumable.py --epochs 1000  # llevar el target a 1000
# (también podés editar `epochs` acá abajo: reanuda y entrena lo que falte.)

vae:
  input_dim: 784                 # 28x28
  latent_dim: 16                 # 16D: deja capacidad para que la PROFUNDIDAD
                                 #      pueda mostrar efecto (con 2D todo sale
                                 #      igual de borroso y enmascara el experimento).
                                 #      Poné 2 si querés el manifold 2D estilo EJ2.
  beta: 1.0                      # peso del KL (beta-VAE)
  learning_rate: 0.001
  batch_size: 256                # batch grande: más eficiente con 60k imágenes
  epochs: 500                    # por arquitectura y por semilla
  seed: 42                       # fallback si no hay lista de semillas abajo

data:
  path: "ej3/data/mnist.npz"
  train_size: 0                  # 0 = usar las 60.000 (overnight). Poné 20000 para pruebas.
  test_size: 5000                # held-out para medir generalización (0 = 10000)
  data_seed: 0                   # fija qué subconjunto se toma (estable entre reanudaciones)

runner:
  checkpoint_every: 5            # guardar checkpoint cada N épocas (resiste corte de luz)
  eval_every: 10                 # medir reconstrucción en test cada N épocas
  log_every: 5                   # imprimir progreso cada N épocas

# Experimento de PROFUNDIDAD: misma latente/épocas/lr/datos; sólo cambia el
# número de capas ocultas. El decoder es el espejo del encoder.
# `seeds`: realizaciones por arquitectura (2 = una réplica para chequear que la
# tendencia no es un outlier; el usuario pidió NO obsesionarse con la varianza).
# El runner corre primero TODAS las arquitecturas con la 1ª semilla (barrido
# completo en ~5 h) y después la 2ª (réplica), así un corte temprano ya deja el
# experimento entero con una semilla.
experiments:
  depth:
    seeds: [42]          # 123 = réplica, deshabilitada por ahora (correr en el futuro si se quiere)
    architectures:
      - { name: "d1", encoder_hidden: [256],                 decoder_hidden: [256] }
      - { name: "d2", encoder_hidden: [512, 256],            decoder_hidden: [256, 512] }
      - { name: "d3", encoder_hidden: [512, 256, 128],       decoder_hidden: [128, 256, 512] }
      - { name: "d4", encoder_hidden: [512, 384, 256, 128],  decoder_hidden: [128, 256, 384, 512] }
