# EJ3 — barrido de LATENTE sobre la mejor red del experimento de profundidad (d2),
# para buscar la mejor GENERACIÓN. latente 2 = estructura 2D (base del manifold).
vae:
  input_dim: 784
  latent_dim: 2
  beta: 1.0
  learning_rate: 0.001
  batch_size: 256
  epochs: 300          # converge antes de 300 (ver corridas de profundidad)
  seed: 42
data:
  path: "ej3/data/mnist.npz"
  train_size: 0        # 60.000
  test_size: 5000
  data_seed: 0
runner:
  checkpoint_every: 5
  eval_every: 10
  log_every: 5
experiments:
  depth:
    seeds: [42]
    architectures:
      - { name: "d2", encoder_hidden: [512, 256], decoder_hidden: [256, 512] }
